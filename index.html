    <!-- Applies the saved theme before first paint, so the page never flashes the
         wrong background, and points the browser chrome at the matching colour.
         Mirrors the toggle logic in Navbar.jsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#030014' : '#f8fafc');
        } catch (e) { /* private mode / storage disabled — fall back to defaults */ }
      })();
    </script>

    <!-- Single Page Apps for GitHub Pages: decodes the path 404.html encoded and
         restores the clean URL via history.replaceState before React Router mounts.
         https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
